<template>
    <div class="slds-grid slds-wrap slds-gutters slds-p-around_medium bg-white">

        <div class="slds-col slds-size_1-of-1 slds-medium-size_9-of-12">
            <lightning-card  title="Products to select">
                <div class="slds-p-around_medium">
                    <div class="slds-grid slds-wrap slds-gutters">
                        <template for:each={products} for:item="prod">
                            <div key={prod.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_medium">
                                <div class="slds-box slds-theme_default">
                                    <h3 class="slds-text-heading_small slds-truncate">{prod.Name}</h3>
                                    <p class="slds-text-color_weak">Código: {prod.ProductCode}</p>
                                    <p class="slds-text-heading_medium slds-m-vertical_small">${prod.Price}</p>
                                    <lightning-button 
                                        label="Añadir al Carrito" 
                                        variant="brand" 
                                        icon-name="utility:add"
                                        data-id={prod.Id}
                                        onclick={handleAddToBag}>
                                    </lightning-button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </lightning-card>
        </div>
    
        <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12">
            <lightning-card title="My cart">
                <div class="slds-p-around_medium">
                    
                </div>
            </lightning-card>
        </div>

    </div>
</template>
